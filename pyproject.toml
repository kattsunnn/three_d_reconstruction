[tool.hatch.build.targets.wheel]
include = [
    "src/three_d_reconstruction.py",
]
[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv.sources]
omni-directional-img-utils = { git = "https://github.com/kattsunnn/omni_directional_img_utils.git" }

