[project]
name = "three_d_reconstruction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naoki", email = "katsudanaoki@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
 "numpy>=2.4.2",
 "omni-directional-img-utils",
]

[build-system]
